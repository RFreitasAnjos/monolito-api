<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title>Categorias</title>
</head>
<body>
<header class="topbar">
    <a th:href="@{/employee/catalog/products}">Produtos</a>
    <form th:action="@{/employee/logout}" method="post">
        <button class="link-button" type="submit">Sair</button>
    </form>
</header>
<main class="container">
    <div class="page-heading">
        <div>
            <h1>Categorias</h1>
            <p>Organização comercial dos produtos.</p>
        </div>
        <a class="button" th:if="${canManage}"
           th:href="@{/employee/catalog/categories/new}">Nova categoria</a>
    </div>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>
    <div class="alert error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <section class="card table-wrapper">
        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Status</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="category : ${categories}">
                <td th:text="${category.name}"></td>
                <td th:text="${category.active ? 'Ativa' : 'Inativa'}"></td>
                <td class="actions">
                    <a th:if="${canManage}"
                       th:href="@{/employee/catalog/categories/{id}/edit(id=${category.id})}">
                        Editar
                    </a>
                    <form th:if="${canManage and category.active}"
                          th:action="@{/employee/catalog/categories/{id}/deactivate(id=${category.id})}"
                          method="post">
                        <button class="link-button danger" type="submit">Desativar</button>
                    </form>
                    <form th:if="${canManage and !category.active}"
                          th:action="@{/employee/catalog/categories/{id}/reactivate(id=${category.id})}"
                          method="post">
                        <button class="link-button" type="submit">Reativar</button>
                    </form>
                </td>
            </tr>
            <tr th:if="${categories.isEmpty()}">
                <td colspan="3">Nenhuma categoria cadastrada.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
