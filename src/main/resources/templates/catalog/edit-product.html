<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title>Editar produto</title>
</head>
<body>
<main class="container narrow">
    <section class="card">
        <h1>Editar produto</h1>
        <form th:action="@{/employee/catalog/products/{id}(id=${product.id})}"
              th:object="${form}" method="post">
            <div class="alert error" th:if="${#fields.hasGlobalErrors()}"
                 th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>

            <label for="sku">SKU</label>
            <input id="sku" th:field="*{sku}">
            <small class="error-text" th:errors="*{sku}"></small>

            <label for="name">Nome</label>
            <input id="name" th:field="*{name}">
            <small class="error-text" th:errors="*{name}"></small>

            <label for="description">Descrição</label>
            <textarea id="description" rows="4" th:field="*{description}"></textarea>
            <small class="error-text" th:errors="*{description}"></small>

            <label for="categoryId">Categoria</label>
            <select id="categoryId" th:field="*{categoryId}">
                <option th:each="category : ${categories}" th:value="${category.id}"
                        th:text="${category.name}"></option>
            </select>
            <small class="error-text" th:errors="*{categoryId}"></small>

            <label for="salePrice">Preço de venda</label>
            <input id="salePrice" type="number" min="0.01" step="0.01"
                   th:field="*{salePrice}">
            <small class="error-text" th:errors="*{salePrice}"></small>

            <label for="inventoryPolicy">Política de estoque</label>
            <select id="inventoryPolicy" th:field="*{inventoryPolicy}">
                <option th:each="policy : ${inventoryPolicies}" th:value="${policy}"
                        th:text="${policy.description}"></option>
            </select>
            <small class="error-text" th:errors="*{inventoryPolicy}"></small>

            <label class="checkbox-option">
                <input type="checkbox" th:field="*{customizable}">
                Produto customizável pelo cliente
            </label>
            <p class="help-text">
                Quando marcado, os ingredientes selecionados serão opções para o cliente.
                Caso contrário, formarão a composição fixa.
            </p>

            <fieldset>
                <legend>Ingredientes</legend>
                <p th:if="${form.ingredients.isEmpty()}">
                    Nenhum ingrediente ativo cadastrado.
                </p>
                <div class="ingredient-option"
                     th:each="selection, stat : *{ingredients}">
                    <input type="hidden"
                           th:field="*{ingredients[__${stat.index}__].ingredientId}">
                    <input type="hidden"
                           th:field="*{ingredients[__${stat.index}__].ingredientName}">
                    <input type="hidden"
                           th:field="*{ingredients[__${stat.index}__].stockUnit}">
                    <label>
                        <input type="checkbox"
                               th:field="*{ingredients[__${stat.index}__].selected}">
                        <span th:text="${selection.ingredientName}"></span>
                    </label>
                    <input type="number" min="0.001" step="0.001"
                           placeholder="Quantidade"
                           th:field="*{ingredients[__${stat.index}__].quantity}">
                    <span th:text="${selection.stockUnit.description}"></span>
                </div>
            </fieldset>

            <div class="actions">
                <button type="submit">Salvar</button>
                <a class="button secondary" th:href="@{/employee/catalog/products}">Cancelar</a>
            </div>
        </form>
    </section>
</main>
</body>
</html>
