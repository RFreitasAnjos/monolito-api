<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <title>Detalhes do estoque</title>
</head>
<body>
<header class="topbar">
    <a th:href="@{/employee/inventory}">Estoque</a>
    <form th:action="@{/employee/logout}" method="post">
        <button class="link-button" type="submit">Sair</button>
    </form>
</header>
<main class="container">
    <div class="page-heading">
        <div>
            <h1 th:text="${item.itemName}">Item</h1>
            <p th:text="|SKU: ${item.sku}|"></p>
        </div>
        <div>
            <strong th:text="|Saldo: ${#numbers.formatDecimal(item.currentQuantity, 1, 3)}|"></strong>
            <p th:if="${item.belowMinimum}" class="error-text">Estoque abaixo do mínimo.</p>
        </div>
    </div>

    <div class="alert success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <div class="inventory-grid" th:if="${canManage}">
        <section class="card">
            <h2>Registrar movimentação</h2>
            <div class="alert error" th:if="${movementError}" th:text="${movementError}"></div>
            <form th:action="@{/employee/inventory/{id}/movements(id=${item.stockItemId})}"
                  th:object="${movementForm}" method="post">
                <div class="alert error" th:if="${#fields.hasGlobalErrors()}"
                     th:each="error : ${#fields.globalErrors()}" th:text="${error}"></div>

                <label for="type">Tipo</label>
                <select id="type" th:field="*{type}">
                    <option value="">Selecione</option>
                    <option th:each="type : ${movementTypes}" th:value="${type}"
                            th:text="${type.description}"></option>
                </select>
                <small class="error-text" th:errors="*{type}"></small>

                <label for="quantity">Quantidade</label>
                <input id="quantity" type="number" min="0.001" step="0.001"
                       th:field="*{quantity}">
                <small class="error-text" th:errors="*{quantity}"></small>

                <label for="unitPrice">Valor unitário</label>
                <input id="unitPrice" type="number" min="0.01" step="0.01"
                       th:field="*{unitPrice}">
                <small>Obrigatório para entradas de compra e saídas por venda.</small>
                <small class="error-text" th:errors="*{unitPrice}"></small>

                <label for="reason">Motivo</label>
                <textarea id="reason" rows="3" th:field="*{reason}"></textarea>
                <small class="error-text" th:errors="*{reason}"></small>

                <button type="submit">Registrar</button>
            </form>
        </section>

        <section class="card">
            <h2>Estoque mínimo</h2>
            <form th:action="@{/employee/inventory/{id}/minimum(id=${item.stockItemId})}"
                  th:object="${minimumForm}" method="post">
                <label for="minimumQuantity">Quantidade mínima</label>
                <input id="minimumQuantity" type="number" min="0" step="0.001"
                       th:field="*{minimumQuantity}">
                <small class="error-text" th:errors="*{minimumQuantity}"></small>
                <button type="submit">Atualizar</button>
            </form>
        </section>
    </div>

    <section class="card table-wrapper">
        <h2>Histórico de movimentações</h2>
        <table>
            <thead>
            <tr>
                <th>Data</th>
                <th>Tipo</th>
                <th>Quantidade</th>
                <th>Saldo resultante</th>
                <th>Valor unitário</th>
                <th>Valor total</th>
                <th>Custo total</th>
                <th>Motivo</th>
                <th>Responsável</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="movement : ${movements}">
                <td th:text="${movement.occurredAt}"></td>
                <td th:text="${movement.type.description}"></td>
                <td th:text="${#numbers.formatDecimal(movement.quantity, 1, 3)}"></td>
                <td th:text="${#numbers.formatDecimal(movement.resultingBalance, 1, 3)}"></td>
                <td th:text="${movement.unitPrice == null ? '-' : #numbers.formatCurrency(movement.unitPrice)}"></td>
                <td th:text="${movement.unitPrice == null ? '-' : #numbers.formatCurrency(movement.totalValue)}"></td>
                <td th:text="${#numbers.formatCurrency(movement.totalCost)}"></td>
                <td th:text="${movement.reason}"></td>
                <td th:text="${movement.actor}"></td>
            </tr>
            <tr th:if="${movements.isEmpty()}">
                <td colspan="9">Nenhuma movimentação registrada.</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
