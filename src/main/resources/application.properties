spring.application.name=mvc-api-pasteldahora
spring.profiles.active=h2
spring.jpa.open-in-view=false
spring.config.import=optional:file:.env[.properties]

springdoc.swagger-ui.path=/swagger-ui.html

# Administrador inicial da área gerencial. Os dados são usados apenas quando
# ainda não existe uma conta com o e-mail informado.
app.employee.bootstrap.name=${EMPLOYEE_ADMIN_NAME:Administrador}
app.employee.bootstrap.cpf=${EMPLOYEE_ADMIN_CPF:52998224725}
app.employee.bootstrap.email=${EMPLOYEE_ADMIN_EMAIL:admin@pasteldahora.local}
app.employee.bootstrap.password=${EMPLOYEE_ADMIN_PASSWORD:ChangeMe@123}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}

spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.notification.email.enabled=${MAIL_ENABLED:false}
app.notification.email.zone-id=${EMAIL_ZONE_ID:America/Sao_Paulo}
app.catalog.cors.allowed-origins=${CATALOG_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
app.customer.cors.allowed-origins=${CUSTOMER_CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:5173}
app.customer.auth.code-validity=${CUSTOMER_AUTH_CODE_VALIDITY:PT10M}
app.customer.auth.request-cooldown=${CUSTOMER_AUTH_REQUEST_COOLDOWN:PT1M}
app.customer.auth.session-validity=${CUSTOMER_AUTH_SESSION_VALIDITY:PT24H}
app.customer.whatsapp.webhook-url=${CUSTOMER_WHATSAPP_WEBHOOK_URL:}
app.customer.whatsapp.bearer-token=${CUSTOMER_WHATSAPP_BEARER_TOKEN:}
