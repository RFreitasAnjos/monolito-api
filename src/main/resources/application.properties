spring.application.name=mvc-api-pasteldahora
spring.profiles.active=h2
spring.jpa.open-in-view=false
spring.config.import=optional:file:.env[.properties]

springdoc.swagger-ui.path=/swagger-ui.html

# Administrador inicial da área gerencial. Os dados são usados apenas quando
# ainda não existe uma conta com o e-mail informado.
app.employee.bootstrap.name=${EMPLOYEE_ADMIN_NAME:Administrador}
app.employee.bootstrap.cpf=${EMPLOYEE_ADMIN_CPF:52998224725}
app.employee.bootstrap.email=${EMPLOYEE_ADMIN_EMAIL:admin@pasteldahora.local}
app.employee.bootstrap.password=${EMPLOYEE_ADMIN_PASSWORD:ChangeMe@123}

mercadopago.access-token=${MERCADOPAGO_ACCESS_TOKEN:}
